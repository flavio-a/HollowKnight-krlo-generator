<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Hunter's Mark random enemies order</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous" />
</head>

<body>
  <div class="container py-4 px-3 mx-auto">
    <h1 class="text-center mb-5">HK Hunter's Mark random enemies order generator</h1>
    <div class="row row-cols-2">
      <!-- Randomizer output -->
      <div class="col">
        <p class="h3">Randomized order:</p>
        <ol id="randomOrderOutput"></ol>
      </div>
      <div class="col">
        <button class="btn btn-primary" id="generateButton">Generate</button>
        <p class="mt-3">
          Link to HKSM for splits:
          <span id="hksmLinkAlt">(will appear after generating an order)</span>
          <a id="hksmLink" target="_blank" class="d-none" href="#">get splits</a>
          <br />
          <small class="text-muted text-small">Did you know that slaurent is the best for making HKSM?</small>
        </p>
        <!-- Form for settings -->
        <p class="mt-3 h4">Settings</p>
        <form id="settingsForm">
          <div class="row g-3 align-items-center">
            <div class="col-auto">
              <label for="inputDifficulty" class="col-form-label">Skips difficulty</label>
            </div>
            <div class="col-auto">
              <select class="form-select" id="inputDifficulty" aria-label="Difficulty selection">
                <option value="0">Easy</option>
                <option value="1" selected>Medium</option>
                <option value="2">Hard</option>
              </select>
            </div>
          </div>
          <div class="mt-3">
            <input type="checkbox" class="form-check-input" id="inputNoMenderbug" checked>
            <label class="form-check-label" for="inputNoMenderbug">Exclude Menderbug</label>
          </div>
        </form>
      </div>
    </div>
  </div>
  <footer class="mb-3">
    <div class="container">
      <a href="index.html" class="me-2">Home</a>
      <a href="credits.html" class="me-2">Credits</a>
      <span id="versionDisplay" class="text-muted me-2"></span>
    </div>
  </footer>
</body>

</html>
